
services:
  postgres:
    image: postgres:16    
    container_name: postgres                                                    # 镜像名称
    restart: always                                                           
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_NON_ROOT_USER
      - POSTGRES_NON_ROOT_PASSWORD
    volumes:
      - ./volumes/db_storage:/var/lib/postgresql/data                        # 设置数据存储位置
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - n8n-net

  n8n:
    image: docker.n8n.io/n8nio/n8n    
    container_name: n8n                                  # 镜像名称
    restart: always
    environment:                                                        # 环境变量
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_NON_ROOT_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
    ports:
      - 5678:5678                                                    #端口映射
    links:
      - postgres
    volumes:
      - ./volumes/n8n_storage:/home/node/.n8n                        #挂载位置
      - ./data:/data/files                                           # 本机文件映射，存储工作流下载数据。
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - n8n-net

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_HOST}
    restart: always
    command: redis-server --save "" --appendonly no   # 纯缓存，不落地
    networks:
      - n8n-net
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./data/redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rsshub:
    image: diygod/rsshub:chromium-bundled   # 带 Chromium，支持需要 puppeteer 的路由
    container_name: ${RSSHub_CONTAINER_NAME}
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - n8n-net
    ports:
      - "${RSSHub_PORT}:1200"
    environment:
      NODE_ENV: production
      REDIS_URL: "redis://${REDIS_HOST}:${REDIS_PORT}/0"
      # 下面给 Redis 缓存加前缀，防止多实例冲突
      REDIS_KEY_PREFIX: "${REDIS_KEY_PREFIX}"
      # 其他参数在这里添加
      # ......
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  n8n-net:
    driver: bridge
    

